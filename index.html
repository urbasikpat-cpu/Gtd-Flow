<body class="min-h-screen flex flex-col transition-colors duration-200 bg-slate-950 text-slate-100">

  <div id="app">
        <!-- Top Header -->
        <header class="sticky top-0 z-30 backdrop-blur-md border-b px-3 sm:px-4 py-2.5 bg-slate-900/90 border-slate-800">
          <div class="max-w-[1200px] mx-auto flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
                ✓
              </div>
              <h1 class="text-sm font-bold tracking-tight hidden xs:block">GTD Flow</h1>
              <button id="btn-copy-code-top" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-600 text-white hover:bg-emerald-500 flex items-center gap-1 shadow-sm transition-all">
                <span>📋 Code kopieren</span>
              </button>
              <button id="btn-open-github" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25 flex items-center gap-1 transition-all">
                <span>📱 GitHub-Hilfe</span>
              </button>
            </div>

            <div class="flex items-center gap-1.5">
              <button id="btn-focus-mode" title="ADHS 1-Task Fokus: Blendet alles bis auf 1 Aufgabe aus" class="px-2 py-1.5 rounded-xl text-[11px] font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/25 hover:bg-indigo-500/20 flex items-center gap-1">
                <span>🎯</span>
                <span class="hidden sm:inline">Fokus</span>
              </button>

              <button id="btn-open-sync" class="px-2 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 bg-slate-950/60 border-slate-800/80 hover:border-indigo-500/40">
                <span>📲</span>
                <span class="hidden sm:inline">Import</span>
              </button>

              <div class="flex p-0.5 rounded-xl border bg-slate-800 border-slate-700">
                <button id="btn-mode-pc" title="PC-Ansicht" class="px-1.5 py-1 rounded-lg text-[11px] font-bold text-slate-400">
                  🖥️
                </button>
                <button id="btn-mode-mobile" title="Handy-Ansicht" class="px-1.5 py-1 rounded-lg text-[11px] font-bold bg-slate-950 text-indigo-400">
                  📱
                </button>
              </div>

              <button id="btn-toggle-theme" class="p-1.5 rounded-xl border text-xs bg-slate-800 text-amber-400 border-slate-700">
                ☀️
              </button>
            </div>
          </div>
        </header>

        <!-- Main Workspace Container -->
        <main class="flex-1 w-full mx-auto p-3 sm:p-5 flex flex-col gap-4 max-w-[430px] pb-16">
          
          <!-- 3-Pillar Navigation -->
          <div class="grid grid-cols-3 p-1 rounded-2xl border bg-slate-900 border-slate-800/90">
            <button data-tab="board" class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-sm">
              <span>⚡ Aufgaben</span>
              <span class="text-[10px] px-1.5 rounded-full bg-indigo-800 text-indigo-100">
                6
              </span>
            </button>

            <button data-tab="projects" class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-indigo-400">
              <span>📁 Projekte</span>
              <span class="text-[10px] px-1.5 rounded-full bg-slate-800 text-slate-400">
                4
              </span>
            </button>

            <button data-tab="shopping" class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-emerald-400">
              <span>🛒 Einkauf</span>
              
                <span class="text-[10px] px-1.5 rounded-full bg-emerald-500/20 text-emerald-400">
                  8
                </span>
              
            </button>
          </div>

          <!-- TAB 1: GTD BOARD -->
          
            <div class="flex flex-col gap-3">
              <!-- Quick Capture Bar -->
              <form id="form-add-task" class="p-1.5 rounded-2xl border flex items-center gap-2 bg-slate-900 border-slate-800/90">
                <div class="flex-1 flex items-center gap-2 pl-2.5">
                  <span class="text-indigo-400 font-bold text-base">+</span>
                  <input id="input-quick-task" type="text" value="" placeholder="Neue Aufgabe (Enter zum Speichern)..." class="w-full bg-transparent py-1.5 text-xs sm:text-sm focus:outline-none placeholder:text-slate-500">
                </div>
                
                <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shrink-0">
                  Hinzufügen
                </button>
              </form>

              <!-- Single-Line Combined Filter Bar -->
              <div class="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
                <div class="flex items-center gap-1.5 shrink-0">
                  <button data-ctx="all" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white">
                    Alle Kontexte
                  </button>
                  
                      <button data-ctx="@Computer" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>💻</span>
                        <span>Computer</span>
                      </button>
                    
                      <button data-ctx="@Zuhause" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>🏠</span>
                        <span>Zuhause</span>
                      </button>
                    
                      <button data-ctx="@Unterwegs" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>🚗</span>
                        <span>Unterwegs</span>
                      </button>
                    
                      <button data-ctx="@Telefon" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>📞</span>
                        <span>Telefon</span>
                      </button>
                    
                      <button data-ctx="⚡ 2-Minuten" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>⚡</span>
                        <span>2-Minuten</span>
                      </button>
                    
                      <button data-ctx="🔋 Low-Energy" class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40">
                        <span>🔋</span>
                        <span>Low-Energy</span>
                      </button>
                    
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                  <select id="select-project-filter" class="text-[11px] font-semibold px-2.5 py-1 rounded-xl border focus:outline-none bg-slate-900 border-slate-800/90">
                    <option value="all" selected="">📁 Alle Projekte</option>
                    
                      <option value="p1">
                        🚀 Website Launch
                      </option>
                    
                      <option value="p2">
                        🌿 Balkon Oase
                      </option>
                    
                      <option value="p3">
                        📊 Steuererklärung
                      </option>
                    
                      <option value="p4">
                        🏠 Wochenplanung &amp; Haushalt
                      </option>
                    
                  </select>

                  
                </div>
              </div>

              <!-- Mobile Column Switcher -->
              
                <div class="grid grid-cols-4 p-1 rounded-xl border bg-slate-900 border-slate-800/90">
                  
                      <button data-mobcol="inbox" class="mob-col-btn py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1 text-slate-400">
                        <span class="truncate">Inbox</span>
                        <span class="text-[10px] opacity-75">(1)</span>

    function detectShoppingCategory(title) {
      if (!title) return 'dry_goods';
      const norm = title.toLowerCase().trim();
      if (norm.includes('tk ') || norm.startsWith('tk-') || norm.includes('tiefkühl')) {
        return 'frozen';
      }
      for (const cat of SHOPPING_CATEGORIES) {
        for (const kw of cat.keywords) {
          if (norm.includes(kw)) return cat.id;
        }
      }
      return 'dry_goods';
    }

    function getRelativeDateString(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const today = getRelativeDateString(0);
      const tomorrow = getRelativeDateString(1);
      if (dateStr === today) return '🔥 Heute';
      if (dateStr === tomorrow) return 'Morgen';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
      } catch {
        return dateStr;
      }
    }

        state.toastMessage = null;
        renderApp();

    function generateTaskCoachSuggestion(task) {
      const norm = task.title.toLowerCase();
      let suggestedContext = task.context || '@Computer';
      let suggestedStatus = task.status === 'inbox' ? 'next' : task.status;

      if (norm.includes('anrufen') || norm.includes('telefon')) suggestedContext = '@Telefon';
      else if (norm.includes('kaufen') || norm.includes('baumarkt') || norm.includes('abholen')) suggestedContext = '@Unterwegs';
      else if (norm.includes('warten') || norm.includes('rückmeldung')) suggestedStatus = 'waiting';
      else if (norm.includes('kurz') || norm.includes('2 min')) suggestedContext = '⚡ 2-Minuten';

      state.taskAiResult = {
        betterTitle: `${task.title} – ersten 2-Minuten-Schritt starten`,
        suggestedStatus,
        suggestedContext,
        microSteps: [
          `1. Alles Nötige für „${task.title.slice(0, 24)}“ bereitstellen (1 Min)`,
          `2. Den allerersten kleinen Handgriff direkt erledigen (2 Min)`,
          `3. Kurz abhaken & nächsten Schritt markieren`
        ]
      };
      renderApp();
    }

    function getCleanHtmlSource() {
      return '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    }

    function copyStandaloneHtmlToClipboard() {
      const htmlContent = getCleanHtmlSource();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(htmlContent).then(() => {
          state.githubSteps.step1 = true;
          showToast('📋 Kompletter App-Code kopiert! Jetzt in GitHub einfügen.');
        }).catch(() => {
          fallbackCopyText(htmlContent);
        });
      } else {
        fallbackCopyText(htmlContent);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        state.githubSteps.step1 = true;
        showToast('📋 Kompletter App-Code kopiert! Jetzt in GitHub einfügen.');
      } catch (err) {
        showToast('Kopieren fehlgeschlagen – bitte Datei herunterladen.');
      }
      document.body.removeChild(ta);
    }

    function downloadStandaloneHtmlFile() {
      const htmlContent = getCleanHtmlSource();
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      state.githubSteps.step1 = true;
      showToast('Datei „index.html“ heruntergeladen 🚀');
    }

    function downloadBackupJson() {
      const data = JSON.stringify({
        tasks: state.tasks,
        projects: state.projects,
        shoppingItems: state.shoppingItems
      }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gtd-flow-backup-${getRelativeDateString(0)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup-Datei (.json) heruntergeladen 💾');
    }

    function addTask() {
      const title = state.quickTitle.trim();
      if (!title) return;
      const assignedContext = state.selectedContextFilter !== 'all' ? state.selectedContextFilter : '@Computer';
      const assignedProject = state.selectedProjectFilter !== 'all' ? state.selectedProjectFilter : '';
      const targetStatus = state.deviceMode === 'mobile' ? state.mobileStatus : 'inbox';

      state.tasks.unshift({
        id: 't-' + Date.now(),
        title,
        status: targetStatus,
        projectId: assignedProject,
        deadline: '',
        context: assignedContext,
        completed: false,
        notes: ''
      });
      state.quickTitle = '';
      savePersistedData();
      const colName = GTD_COLUMNS.find(c => c.id === targetStatus)?.shortTitle || 'Inbox';
      showToast(`In „${colName}“ gespeichert ✨`);
    }

    function quickAddAsShopping() {
      const title = state.quickTitle.trim();
      if (!title) return;
      const catId = detectShoppingCategory(title);
      const catObj = SHOPPING_CATEGORIES.find(c => c.id === catId);
      state.shoppingItems.unshift({
        id: 's-' + Date.now(),
        title,
        category: catId,
        checked: false
      });
      state.quickTitle = '';
      savePersistedData();
      showToast(`In ${catObj ? catObj.shortLabel : 'Einkauf'} gelegt 🛒`);
    }

    function addShoppingItems() {
      const raw = state.shoppingInput.trim();
      if (!raw) return;
      const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
      parts.forEach((title, idx) => {
        state.shoppingItems.unshift({
          id: `s-${Date.now()}-${idx}`,
          title,
          category: detectShoppingCategory(title),
          checked: false
        });
      });
      state.shoppingInput = '';
      savePersistedData();
      showToast(parts.length === 1 ? `„${parts[0]}“ einsortiert 🛒` : `${parts.length} Artikel einsortiert 🛒`);
    }

    function toggleTaskCompleted(taskId) {
      const t = state.tasks.find(item => item.id === taskId);
      if (!t) return;
      t.completed = !t.completed;
      if (state.focusTaskId === taskId && t.completed) {
        state.focusTaskId = null;
      }
      savePersistedData();
      showToast(t.completed ? 'Erledigt! Stark gemacht 🎉' : 'Wieder geöffnet');
    }

      const t = state.tasks.find(item => item.id === taskId);

    function startRandomFocusTask() {
      const candidates = state.tasks.filter(t => !t.completed && (t.status === 'next' || t.status === 'inbox'));
      if (candidates.length === 0) {
        showToast('Keine offenen Aufgaben für den Fokus-Modus 🎉');
        return;
      }
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      state.focusTaskId = pick.id;
      renderApp();
    }

    function openGoogleCalendar(task) {
      if (!task) return;
      const text = encodeURIComponent(task.title);
      const project = state.projects.find(p => p.id === task.projectId);
      const details = encodeURIComponent(
        `GTD Kontext: ${task.context || '-'}\nProjekt: ${project ? project.name : 'Kein Projekt'}\nNotiz: ${task.notes || ''}`
      );
      let datesParam = '';
      if (task.deadline) {
        const cleanDate = task.deadline.replace(/-/g, '');
        datesParam = `&dates=${cleanDate}/${cleanDate}`;
      }
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&details=${details}${datesParam}`;
      window.open(url, '_blank');
    }

    function bulkImportFromText() {
      const raw = state.bulkImportText.trim();
      if (!raw) return;
      const lines = raw.split('\n').map(l => l.replace(/^[-*•\d.)\s]+/, '').trim()).filter(Boolean);
      let tCount = 0;
      let sCount = 0;
      lines.forEach((line, idx) => {
        if (line.toLowerCase().startsWith('einkauf:') || line.toLowerCase().startsWith('kaufen:')) {
          const clean = line.replace(/^(einkauf|kaufen):\s*/i, '').trim();
          state.shoppingItems.unshift({
            id: `s-imp-${Date.now()}-${idx}`,
            title: clean,
            category: detectShoppingCategory(clean),
            checked: false
          });
          sCount++;
        } else {
          state.tasks.unshift({
            id: `t-imp-${Date.now()}-${idx}`,
            title: line,
            status: 'inbox',
            projectId: '',
            deadline: '',
            context: '@Computer',
            completed: false,
            notes: ''
          });
          tCount++;
        }
      });
      state.bulkImportText = '';
      state.showSyncModal = false;
      savePersistedData();
      showToast(`${tCount} Aufgaben & ${sCount} Einkäufe importiert ✨`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      });

      const shopInput = document.getElementById('input-shopping');
      if (shopInput) {
        shopInput.addEventListener('input', (e) => {
          const pos = shopInput.selectionStart;
          state.shoppingInput = e.target.value;
          renderApp();
          const restored = document.getElementById('input-shopping');
          if (restored) {
            restored.focus();
            restored.setSelectionRange(pos, pos);
          }
        });
      }
      on('form-add-shopping', 'submit', (e) => { e.preventDefault(); addShoppingItems(); });
      on('btn-supermarket-mode', 'click', () => { state.supermarketMode = !state.supermarketMode; renderApp(); });

      document.querySelectorAll('.shop-item-row').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.getAttribute('data-shopid');
          const item = state.shoppingItems.find(i => i.id === id);
          if (item) {
            item.checked = !item.checked;
            savePersistedData();
            renderApp();
          }
        });
      });

      on('btn-toggle-checked-shop', 'click', () => {
        state.showCheckedShopping = !state.showCheckedShopping;
        renderApp();
      });
      on('btn-clear-checked-shop', 'click', () => {
        state.shoppingItems = state.shoppingItems.filter(i => !i.checked);
        savePersistedData();
        showToast('Einkaufswagen geleert ✨');
      });

      const selectedTask = state.tasks.find(t => t.id === state.selectedTaskId);
      if (selectedTask) {
        on('btn-close-task-modal', 'click', () => { state.selectedTaskId = null; renderApp(); });
        on('modal-task-backdrop', 'click', () => { state.selectedTaskId = null; renderApp(); });

        on('input-edit-task-title', 'input', (e) => { selectedTask.title = e.target.value; savePersistedData(); });
        on('input-edit-notes', 'input', (e) => { selectedTask.notes = e.target.value; savePersistedData(); });
        on('select-edit-project', 'change', (e) => { selectedTask.projectId = e.target.value; renderApp(); });
        on('input-edit-deadline', 'change', (e) => { selectedTask.deadline = e.target.value; renderApp(); });

        on('btn-date-today', 'click', () => { selectedTask.deadline = getRelativeDateString(0); renderApp(); });
        on('btn-date-tomorrow', 'click', () => { selectedTask.deadline = getRelativeDateString(1); renderApp(); });

        document.querySelectorAll('.btn-edit-status').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedTask.status = btn.getAttribute('data-editstatus');
            renderApp();
          });
        });

        document.querySelectorAll('.btn-edit-ctx').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedTask.context = btn.getAttribute('data-editctx');
            renderApp();
          });
        });

        on('btn-run-task-ai', 'click', () => generateTaskCoachSuggestion(selectedTask));
        document.querySelectorAll('.btn-add-microstep').forEach(btn => {
          btn.addEventListener('click', () => {
            const stepText = btn.getAttribute('data-microstep');
            state.tasks.unshift({
              id: 't-sub-' + Date.now(),
              title: stepText,
              status: 'next',
              projectId: selectedTask.projectId,
              context: '⚡ 2-Minuten',
              deadline: '',
              completed: false,
              notes: ''
            });
            savePersistedData();
            showToast('Als 2-Minuten-Aufgabe angelegt ✨');
          });
        });

        on('btn-gcal-export', 'click', () => openGoogleCalendar(selectedTask));
        on('btn-move-to-shop', 'click', () => {
          const catId = detectShoppingCategory(selectedTask.title);
          state.shoppingItems.unshift({
            id: 's-' + Date.now(),
            title: selectedTask.title,
            category: catId,
            checked: false
          });
          state.tasks = state.tasks.filter(t => t.id !== selectedTask.id);
          state.selectedTaskId = null;
          savePersistedData();
          showToast('Auf die Einkaufsliste verschoben 🛒');
        });

        on('btn-delete-task', 'click', () => {
          state.tasks = state.tasks.filter(t => t.id !== selectedTask.id);
          state.selectedTaskId = null;
          savePersistedData();
          showToast('Aufgabe gelöscht');
        });
      }
    }

    window.onload = function () {
      renderApp();
    };
  </script>

</body></html>
