<!DOCTYPE html>
<!-- 
  GTD Flow - Entry Point
  This is the main HTML file for the Vite project. 
  The app UI is dynamically rendered into the <div id="app"> container by src/main.js.
  Styling is handled by Tailwind CSS via style.css.
-->
<html class="dark" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>GTD Flow &amp; Einkauf</title>
<!-- Web-App / Homescreen Meta-Tags für iOS & Android -->
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="GTD Flow" name="apple-mobile-web-app-title"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="#090d16" name="theme-color"/>
<!-- App-Icon als eingebettetes SVG -->
<link href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='24' fill='%234f46e5'/&gt;&lt;path d='M30 52l14 14 28-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" rel="icon" type="image/svg+xml"/>
<link href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' rx='24' fill='%234f46e5'/&gt;&lt;path d='M30 52l14 14 28-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/&gt;&lt;/svg&gt;" rel="apple-touch-icon"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="/style.css" rel="stylesheet"/></head>
<body class="min-h-screen flex flex-col transition-colors duration-200 bg-slate-950 text-slate-100">
<div id="app">
<!-- Top Header -->
<header class="sticky top-0 z-30 backdrop-blur-md border-b px-3 sm:px-4 py-2.5 bg-slate-900/90 border-slate-800">
<div class="max-w-[1200px] mx-auto flex items-center justify-between gap-1.5">
<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
                ✓
              </div>
<h1 class="text-sm font-bold tracking-tight hidden xs:block">GTD Flow</h1>
              <div
                class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-800 text-slate-400 flex items-center gap-1 shadow-sm"
                title="Vite Build Setup aktiv"
              >
                <span>⚡ Vite Setup</span>
              </div>
<button class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25 flex items-center gap-1 transition-all" id="btn-open-github">
<span>📱 GitHub-Hilfe</span>
</button>
</div>
<div class="flex items-center gap-1.5">
<button class="px-2 py-1.5 rounded-xl text-[11px] font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/25 hover:bg-indigo-500/20 flex items-center gap-1" id="btn-focus-mode" title="ADHS 1-Task Fokus: Blendet alles bis auf 1 Aufgabe aus">
<span>🎯</span>
<span class="hidden sm:inline">Fokus</span>
</button>
<button class="px-2 py-1.5 rounded-xl text-[11px] font-bold border flex items-center gap-1 bg-slate-950/60 border-slate-800/80 hover:border-indigo-500/40" id="btn-open-sync">
<span>📲</span>
<span class="hidden sm:inline">Import</span>
</button>
<div class="flex p-0.5 rounded-xl border bg-slate-800 border-slate-700">
<button class="px-1.5 py-1 rounded-lg text-[11px] font-bold text-slate-400" id="btn-mode-pc" title="PC-Ansicht">
                  🖥️
                </button>
<button class="px-1.5 py-1 rounded-lg text-[11px] font-bold bg-slate-950 text-indigo-400" id="btn-mode-mobile" title="Handy-Ansicht">
                  📱
                </button>
</div>
<button class="p-1.5 rounded-xl border text-xs bg-slate-800 text-amber-400 border-slate-700" id="btn-toggle-theme">
                ☀️
              </button>
</div>
</div>
</header>
<!-- Main Workspace Container -->
<main class="flex-1 w-full mx-auto p-3 sm:p-5 flex flex-col gap-4 max-w-[430px] pb-16">
<!-- 3-Pillar Navigation -->
<div class="grid grid-cols-3 p-1 rounded-2xl border bg-slate-900 border-slate-800/90">
<button class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-indigo-600 text-white shadow-sm" data-tab="board">
<span>⚡ Aufgaben</span>
<span class="text-[10px] px-1.5 rounded-full bg-indigo-800 text-indigo-100">
                6
              </span>
</button>
<button class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-indigo-400" data-tab="projects">
<span>📁 Projekte</span>
<span class="text-[10px] px-1.5 rounded-full bg-slate-800 text-slate-400">
                4
              </span>
</button>
<button class="tab-btn py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 text-slate-400 hover:text-emerald-400" data-tab="shopping">
<span>🛒 Einkauf</span>
<span class="text-[10px] px-1.5 rounded-full bg-emerald-500/20 text-emerald-400">
                  8
                </span>
</button>
</div>
<!-- TAB 1: GTD BOARD -->
<div class="flex flex-col gap-3">
<!-- Quick Capture Bar -->
<form class="p-1.5 rounded-2xl border flex items-center gap-2 bg-slate-900 border-slate-800/90" id="form-add-task">
<div class="flex-1 flex items-center gap-2 pl-2.5">
<span class="text-indigo-400 font-bold text-base">+</span>
<input class="w-full bg-transparent py-1.5 text-xs sm:text-sm focus:outline-none placeholder:text-slate-500" id="input-quick-task" placeholder="Neue Aufgabe (Enter zum Speichern)..." type="text" value=""/>
</div>
<button class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shrink-0" type="submit">
                  Hinzufügen
                </button>
</form>
<!-- Single-Line Combined Filter Bar -->
<div class="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
<div class="flex items-center gap-1.5 shrink-0">
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all bg-indigo-600 text-white" data-ctx="all">
                    Alle Kontexte
                  </button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="@Computer">
<span>💻</span>
<span>Computer</span>
</button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="@Zuhause">
<span>🏠</span>
<span>Zuhause</span>
</button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="@Unterwegs">
<span>🚗</span>
<span>Unterwegs</span>
</button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="@Telefon">
<span>📞</span>
<span>Telefon</span>
</button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="⚡ 2-Minuten">
<span>⚡</span>
<span>2-Minuten</span>
</button>
<button class="ctx-filter-btn px-2.5 py-1 rounded-xl text-[11px] font-semibold transition-all flex items-center gap-1 border bg-slate-900 border-slate-800/90 text-slate-400 hover:border-indigo-500/40" data-ctx="🔋 Low-Energy">
<span>🔋</span>
<span>Low-Energy</span>
</button>
</div>
<div class="flex items-center gap-1.5 shrink-0">
<select class="text-[11px] font-semibold px-2.5 py-1 rounded-xl border focus:outline-none bg-slate-900 border-slate-800/90" id="select-project-filter">
<option selected="" value="all">📁 Alle Projekte</option>
<option value="p1">
                        🚀 Website Launch
                      </option>
<option value="p2">
                        🌿 Balkon Oase
                      </option>
<option value="p3">
                        📊 Steuererklärung
                      </option>
<option value="p4">
                        🏠 Wochenplanung &amp; Haushalt
                      </option>
</select>
</div>
</div>
<!-- Mobile Column Switcher -->
<div class="grid grid-cols-4 p-1 rounded-xl border bg-slate-900 border-slate-800/90">
<button class="mob-col-btn py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1 text-slate-400" data-mobcol="inbox">
<span class="truncate">Inbox</span>
<span class="text-[10px] opacity-75">(1)</span>
</button>
<button class="mob-col-btn py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1 bg-indigo-600 text-white" data-mobcol="next">
<span class="truncate">Nächste</span>
<span class="text-[10px] opacity-75">(3)</span>
</button>
<button class="mob-col-btn py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1 text-slate-400" data-mobcol="waiting">
<span class="truncate">Warten</span>
<span class="text-[10px] opacity-75">(1)</span>
</button>
<button class="mob-col-btn py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1 text-slate-400" data-mobcol="someday">
<span class="truncate">Später</span>
<span class="text-[10px] opacity-75">(1)</span>
</button>
</div>
<!-- Columns Grid -->
<div class="space-y-3">
<div class="gtd-col-drop rounded-2xl border p-3 flex flex-col gap-2.5 min-h-[280px] transition-all bg-slate-900 border-slate-800/90" data-coldrop="next">
<div class="flex items-center justify-between border-b pb-2 border-slate-800/80">
<div class="flex items-center gap-1.5">
<span class="text-xs">⚡</span>
<h3 class="font-bold text-xs">Nächste Schritte</h3>
</div>
<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/15 text-indigo-400">
                          3
                        </span>
</div>
<div class="space-y-2 flex-1">
<div class="task-card group border p-2.5 rounded-xl cursor-pointer transition-all hover:border-indigo-500/50 bg-slate-950/60 border-slate-800/80" data-taskid="t2" draggable="true">
<div class="flex items-start justify-between gap-2">
<div class="flex items-start gap-2.5 min-w-0">
<button class="btn-check-task mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors border-slate-400 hover:border-indigo-400" data-checktask="t2">
</button>
<span class="text-xs font-medium leading-snug">
                                    Mobile Navigation in Figma finalisieren
                                  </span>
</div>
</div>
<div class="flex items-center gap-2 flex-wrap pt-2 mt-1.5 border-t text-[10px] border-slate-800/80 text-slate-400">
<span class="font-medium">💻 Computer</span>
<span class="text-indigo-400 font-medium truncate max-w-[125px]">• 🚀 Website Launch</span>
<span class="text-amber-400 font-semibold ml-auto">🔥 Heute</span>
</div>
</div>
<div class="task-card group border p-2.5 rounded-xl cursor-pointer transition-all hover:border-indigo-500/50 bg-slate-950/60 border-slate-800/80" data-taskid="t3" draggable="true">
<div class="flex items-start justify-between gap-2">
<div class="flex items-start gap-2.5 min-w-0">
<button class="btn-check-task mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors border-slate-400 hover:border-indigo-400" data-checktask="t3">
</button>
<span class="text-xs font-medium leading-snug">
                                    Blumenerde &amp; Übertöpfe im Baumarkt holen
                                  </span>
</div>
</div>
<div class="flex items-center gap-2 flex-wrap pt-2 mt-1.5 border-t text-[10px] border-slate-800/80 text-slate-400">
<span class="font-medium">🚗 Unterwegs</span>
<span class="text-indigo-400 font-medium truncate max-w-[125px]">• 🌿 Balkon Oase</span>
<span class="text-amber-400 font-semibold ml-auto">21. Okt.</span>
</div>
</div>
<div class="task-card group border p-2.5 rounded-xl cursor-pointer transition-all hover:border-indigo-500/50 bg-slate-950/60 border-slate-800/80" data-taskid="t4" draggable="true">
<div class="flex items-start justify-between gap-2">
<div class="flex items-start gap-2.5 min-w-0">
<button class="btn-check-task mt-0.5 w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors border-slate-400 hover:border-indigo-400" data-checktask="t4">
</button>
<span class="text-xs font-medium leading-snug">
                                    Küche kurz aufräumen &amp; Spülmaschine starten
                                  </span>
</div>
</div>
<div class="flex items-center gap-2 flex-wrap pt-2 mt-1.5 border-t text-[10px] border-slate-800/80 text-slate-400">
<span class="font-medium">⚡ 2-Minuten</span>
<span class="text-indigo-400 font-medium truncate max-w-[125px]">• 🏠 Wochenplanung &amp; Haushalt</span>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- TAB 2: PROJECTS -->
<!-- TAB 3: SHOPPING LIST -->
</main>

<!-- SYNC & IMPORT MODAL -->

<!-- TASK DETAIL & AI COACH MODAL -->
