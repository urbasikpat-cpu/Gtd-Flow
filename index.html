<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GTD Flow & Einkauf | Studio Edition</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GTD Flow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090b0e" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%2312151c'/><path d='M32 52l13 13 25-27' stroke='%2334d399' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

  <!-- Typography: Space Grotesk & Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            serif: ['"Newsreader"', 'serif'],
          },
          colors: {
            studio: {
              bg: '#090b0e',
              card: '#11141c',
              border: '#1f2533',
              accent: '#34d399',
              muted: '#8b94a5'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.01em;
    }
    .font-editorial {
      font-family: 'Newsreader', serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .bg-grain {
      background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .light .bg-grain {
      background-image: radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 0);
    }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300 bg-grain selection:bg-emerald-400 selection:text-black">

  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'gtd_flow_studio_v7';
    const AI_CONFIG_KEY = 'gtd_flow_ai_config_v7';

    const GTD_COLUMNS = [
      { id: 'inbox', title: 'Inbox', shortTitle: 'Inbox', icon: '📥', badgeBg: 'bg-zinc-500/15 text-zinc-400 border-zinc-500/20' },
      { id: 'next', title: 'Nächste Schritte', shortTitle: 'Nächste', icon: '⚡', badgeBg: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/20' },
      { id: 'waiting', title: 'Warten auf', shortTitle: 'Warten', icon: '⏳', badgeBg: 'bg-amber-500/15 text-amber-400 border-amber-500/20' },
      { id: 'someday', title: 'Später / Vielleicht', shortTitle: 'Später', icon: '🌱', badgeBg: 'bg-indigo-500/15 text-indigo-400 border-indigo-500/20' }
    ];

    // Refined Physical & Knowledge Contexts (incl. AI Studio / LLM Workspace)
    const CONTEXT_DEFINITIONS = [
      { id: '@Computer', label: 'Computer', emoji: '💻' },
      { id: '@KI-Studio', label: 'KI-Umgebung / Prompting', emoji: '🤖' },
      { id: '@Zuhause', label: 'Zuhause', emoji: '🏠' },
      { id: '@Unterwegs', label: 'Unterwegs', emoji: '🚗' },
      { id: '@Telefon', label: 'Telefon', emoji: '📞' }
    ];

    // Orthogonal Energy Definitions
    const ENERGY_DEFINITIONS = [
      { id: 'quick', label: '⚡ 2-Minuten', desc: 'Sofort-Erfolg' },
      { id: 'low', label: '🔋 Low-Energy', desc: 'Entspannt' },
      { id: 'deep', label: '🔥 Deep Focus', desc: 'Volle Energie' }
    ];

    const SHOPPING_CATEGORIES = [
      { id: 'fresh', label: '🥦 Obst & Gemüse', shortLabel: 'Obst & Gemüse', keywords: ['apfel', 'äpfel', 'banane', 'tomate', 'gurke', 'salat', 'avocado', 'zwiebel', 'knoblauch', 'kartoffel', 'karotte', 'möhre', 'paprika', 'beeren', 'zitrone', 'pilze', 'brokkoli', 'zucchini', 'ingwer', 'kräuter', 'basilikum', 'obst', 'gemüse'] },
      { id: 'bakery', label: '🥖 Brot & Backwaren', shortLabel: 'Bäckerei', keywords: ['brot', 'brötchen', 'semmel', 'toast', 'baguette', 'brezel', 'kuchen', 'croissant', 'vollkornbrot', 'sauerteig', 'wraps'] },
      { id: 'meat_fish', label: '🥩 Fleisch, Wurst & Fisch', shortLabel: 'Fleisch & Fisch', keywords: ['fleisch', 'hähnchen', 'pute', 'rind', 'schwein', 'hack', 'steak', 'lachs', 'fisch', 'forelle', 'garnelen', 'wurst', 'schinken', 'salami', 'aufschnitt', 'bacon'] },
      { id: 'fridge', label: '🧀 Kühlregal, Milch & Käse', shortLabel: 'Kühlregal', keywords: ['milch', 'hafermilch', 'käse', 'gouda', 'mozzarella', 'parmesan', 'feta', 'frischkäse', 'butter', 'margarine', 'joghurt', 'quark', 'skyr', 'eier', 'hummus', 'sahne', 'tofu', 'gnocchi'] },
      { id: 'dry_goods', label: '🍝 Trockenware, Nudeln & Reis', shortLabel: 'Trockenware & Nudeln', keywords: ['nudel', 'spaghetti', 'pasta', 'penne', 'reis', 'basmati', 'risotto', 'linsen', 'couscous', 'bulgur', 'quinoa', 'haferflocken', 'müsli', 'mehl', 'zucker', 'hefe', 'paniermehl'] },
      { id: 'canned', label: '🥫 Konserven, Gläser & Soßen', shortLabel: 'Konserven & Vorrat', keywords: ['dose', 'dosentomaten', 'tomatenmark', 'mais', 'bohnen', 'kidneybohnen', 'kichererbsen', 'thunfisch', 'kokosmilch', 'pesto', 'soße', 'sauce', 'öl', 'olivenöl', 'essig', 'senf', 'ketchup', 'mayo', 'brühe', 'gewürz', 'salz', 'pfeffer', 'marmelade', 'honig', 'oliven'] },
      { id: 'frozen', label: '🧊 Tiefkühltruhe (TK)', shortLabel: 'Tiefkühltruhe', keywords: ['tiefkühl', 'tk', 'pizza', 'eis', 'eiscreme', 'pommes', 'spinat', 'rahmspinat', 'fischstäbchen', 'tk-gemüse', 'tk-beeren', 'kroketten'] },
      { id: 'snacks', label: '🍫 Snacks, Süßes & Nüsse', shortLabel: 'Snacks & Süßes', keywords: ['schokolade', 'schoki', 'chips', 'nüsse', 'mandeln', 'kekse', 'haribo', 'gummibärchen', 'riegel', 'popcorn', 'salzstangen'] },
      { id: 'drinks', label: '🥤 Getränke, Kaffee & Tee', shortLabel: 'Getränke & Kaffee', keywords: ['wasser', 'sprudel', 'mineralwasser', 'kaffee', 'espresso', 'bohnen', 'tee', 'saft', 'apfelsaft', 'orangensaft', 'schorle', 'cola', 'limo', 'bier', 'wein'] },
      { id: 'household', label: '🧻 Haushalt, Putzen & Papier', shortLabel: 'Haushalt', keywords: ['spüli', 'spülmittel', 'tabs', 'spülmaschinentabs', 'klopapier', 'toilettenpapier', 'küchenrolle', 'taschentücher', 'waschmittel', 'müllbeutel', 'backpapier', 'alufolie', 'schwamm', 'putzmittel', 'batterien', 'blumenerde'] },
      { id: 'drugstore', label: '🧴 Drogerie & Körperpflege', shortLabel: 'Drogerie', keywords: ['seife', 'shampoo', 'duschgel', 'zahnpasta', 'zahnbürste', 'deo', 'creme', 'bodylotion', 'rasierer', 'pflaster', 'sonnencreme'] }
    ];

    function detectShoppingCategory(title) {
      if (!title) return 'dry_goods';
      const norm = title.toLowerCase().trim();
      if (norm.includes('tk ') || norm.startsWith('tk-') || norm.includes('tiefkühl')) return 'frozen';
      for (const cat of SHOPPING_CATEGORIES) {
        for (const kw of cat.keywords) {
          if (norm.includes(kw)) return cat.id;
        }
      }
      return 'dry_goods';
    }

    function getRelativeDateString(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatReadableDate(dateStr) {
      if (!dateStr) return '';
      const today = getRelativeDateString(0);
      const tomorrow = getRelativeDateString(1);
      if (dateStr === today) return '🔥 Heute';
      if (dateStr === tomorrow) return 'Morgen';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
      } catch {
        return dateStr;
      }
    }

    function getDaysAgo(dateStr) {
      if (!dateStr) return 0;
      try {
        const d = new Date(dateStr);
        const now = new Date();
        const diffTime = Math.abs(now - d);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      } catch {
        return 0;
      }
    }

    const DEFAULT_PROJECTS = [
      { id: 'p1', name: 'Website Launch', icon: '🚀' },
      { id: 'p2', name: 'Balkon Oase', icon: '🌿' },
      { id: 'p3', name: 'Steuererklärung', icon: '📊' },
      { id: 'p4', name: 'Wochenplanung & Haushalt', icon: '🏠' }
    ];

    const DEFAULT_TASKS = [
      { id: 't1', title: 'Steuerberater wegen Belegen kurz anrufen', status: 'inbox', projectId: 'p3', deadline: getRelativeDateString(1), context: '@Telefon', energy: 'quick', completed: false, notes: 'Belege zusammentragen & Kanzlei kontaktieren', createdAt: getRelativeDateString(0) },
      { id: 't2', title: 'Mobile Navigation in Figma finalisieren', status: 'next', projectId: 'p1', deadline: getRelativeDateString(0), context: '@Computer', energy: 'deep', completed: false, notes: 'Kontraste & Button-Höhen anpassen', createdAt: getRelativeDateString(-1) },
      { id: 't3', title: 'Blumenerde & Übertöpfe im Baumarkt holen', status: 'next', projectId: 'p2', deadline: getRelativeDateString(3), context: '@Unterwegs', energy: 'quick', completed: false, notes: '2 Säcke Bio-Erde für Hochbeet', createdAt: getRelativeDateString(-2) },
      { id: 't4', title: 'Rückmeldung vom Hosting-Support abwarten', status: 'waiting', projectId: 'p1', deadline: '', context: '@Computer', energy: 'low', completed: false, notes: 'Ticket #4092 bzgl. SSL-Zertifikat', createdAt: getRelativeDateString(-4) }
    ];

    const DEFAULT_SHOPPING = [
      { id: 's1', title: 'Avocados, Cherrytomaten & Gurke', category: 'fresh', checked: false },
      { id: 's2', title: 'Frisches Sauerteigbrot', category: 'bakery', checked: false },
      { id: 's3', title: 'Hähnchenbrustfilet (400g) & Lachs', category: 'meat_fish', checked: false },
      { id: 's4', title: 'Hafermilch, Eier & Mozzarella', category: 'fridge', checked: false },
      { id: 's5', title: 'Spaghetti, Basmatireis & Haferflocken', category: 'dry_goods', checked: false }
    ];

    function loadPersistedData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function loadAiConfig() {
      try {
        const raw = localStorage.getItem(AI_CONFIG_KEY);
        return raw ? JSON.parse(raw) : { provider: 'gemini', apiKey: '' };
      } catch {
        return { provider: 'gemini', apiKey: '' };
      }
    }

    const savedData = loadPersistedData();
    const savedAi = loadAiConfig();

    const state = {
      darkMode: savedData && typeof savedData.darkMode === 'boolean' ? savedData.darkMode : true,
      deviceMode: window.innerWidth < 768 ? 'mobile' : 'pc',
      activeTab: 'board', // 'board' | 'calendar' | 'projects' | 'shopping'
      mobileStatus: 'next',
      selectedContextFilter: 'all',
      selectedEnergyFilter: 'all',
      selectedProjectFilter: 'all',
      draggedTaskId: null,
      quickTitle: '',
      shoppingInput: '',
      supermarketMode: false,
      showCheckedShopping: false,
      newProjectIcon: '🎯',
      newProjectName: '',
      selectedTaskId: null,
      focusTaskId: null,
      showAiSettingsModal: false,
      aiApiKey: savedAi.apiKey || '',
      aiProvider: savedAi.provider || 'gemini',
      aiLoading: false,
      toastMessage: null,
      projects: savedData && Array.isArray(savedData.projects) ? savedData.projects : DEFAULT_PROJECTS,
      tasks: savedData && Array.isArray(savedData.tasks) ? savedData.tasks : DEFAULT_TASKS,
      shoppingItems: savedData && Array.isArray(savedData.shoppingItems) ? savedData.shoppingItems : DEFAULT_SHOPPING
    };

    function savePersistedData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          darkMode: state.darkMode,
          projects: state.projects,
          tasks: state.tasks,
          shoppingItems: state.shoppingItems
        }));
        localStorage.setItem(AI_CONFIG_KEY, JSON.stringify({
          provider: state.aiProvider,
          apiKey: state.aiApiKey
        }));
      } catch (e) {
        console.error("Storage persistence error:", e);
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      state.toastMessage = msg;
      renderApp();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toastMessage = null;
        renderApp();
      }, 2800);
    }

    async function callAiCoach(promptText, systemInstruction) {
      if (!state.aiApiKey.trim()) {
        throw new Error('Kein API-Key hinterlegt. Bitte in den KI-Einstellungen eintragen.');
      }

      if (state.aiProvider === 'gemini') {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${state.aiApiKey.trim()}`;
        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: { responseMimeType: "application/json" }
        };
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('Gemini API Fehler');
        const data = await res.json();
        const jsonStr = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        return JSON.parse(jsonStr);
      } else if (state.aiProvider === 'openai') {
        const url = `https://api.openai.com/v1/chat/completions`;
        const payload = {
          model: 'gpt-4o-mini',
          messages: [
            { role: 'system', content: systemInstruction },
            { role: 'user', content: promptText }
          ],
          response_format: { type: "json_object" }
        };
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.aiApiKey.trim()}` }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('OpenAI API Fehler');
        const data = await res.json();
        return JSON.parse(data.choices[0].message.content);
      } else if (state.aiProvider === 'claude') {
        const url = `https://api.anthropic.com/v1/messages`;
        const payload = {
          model: 'claude-3-5-sonnet-20241022',
          max_tokens: 1000,
          system: systemInstruction,
          messages: [{ role: 'user', content: promptText }]
        };
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': state.aiApiKey.trim(),
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Claude API Fehler');
        const data = await res.json();
        const text = data.content?.[0]?.text || '{}';
        const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(cleaned);
      }
      throw new Error('Unbekannter Provider');
    }

    async function runTaskAiAssistant(task) {
      if (!state.aiApiKey.trim()) {
        state.showAiSettingsModal = true;
        renderApp();
        showToast('Bitte erst deinen KI-API-Key eintragen ⚙️');
        return;
      }
      state.aiLoading = true;
      renderApp();
      try {
        const sys = `Du bist ein erfahrener GTD-Coach. Analysiere die Aufgabe und liefere JSON mit:
- 'betterTitle': Konkreter nächster physischer Schritt (max 8 Wörter)
- 'suggestedStatus': 'next', 'waiting' atau 'someday'
- 'suggestedContext': '@Computer', '@KI-Studio', '@Zuhause', '@Unterwegs' oder '@Telefon'
- 'microSteps': Array mit 3 winzigen 2-Minuten Schritten`;
        
        const res = await callAiCoach(`Aufgabe: ${task.title}\nNotiz: ${task.notes || ''}`, sys);
        if (res.betterTitle) task.title = res.betterTitle;
        if (res.suggestedStatus) task.status = res.suggestedStatus;
        if (res.suggestedContext) task.context = res.suggestedContext;
        savePersistedData();
        showToast('KI-Starthilfe erfolgreich angewendet ✨');
      } catch (err) {
        showToast('KI-Fehler: ' + err.message);
      } finally {
        state.aiLoading = false;
        renderApp();
      }
    }

    async function runShoppingAiExtractor() {
      if (!state.aiApiKey.trim()) {
        state.showAiSettingsModal = true;
        renderApp();
        showToast('Bitte erst deinen KI-API-Key eintragen ⚙️');
        return;
      }
      const raw = state.shoppingInput.trim();
      if (!raw) return;
      state.aiLoading = true;
      renderApp();
      try {
        const sys = `Du extrahierst aus Freitext Einkaufsartikel. Liefere JSON:
{ "items": [ { "title": "Artikelname", "category": "fresh|bakery|meat_fish|fridge|dry_goods|canned|frozen|snacks|drinks|household|drugstore" } ] }`;
        const res = await callAiCoach(raw, sys);
        if (res && Array.isArray(res.items)) {
          res.items.forEach((it, idx) => {
            state.shoppingItems.unshift({
              id: `s-ai-${Date.now()}-${idx}`,
              title: it.title,
              category: it.category || detectShoppingCategory(it.title),
              checked: false
            });
          });
          state.shoppingInput = '';
          showToast(`${res.items.length} Artikel per KI einsortiert 🛒`);
        }
      } catch (err) {
        showToast('KI-Fehler: ' + err.message);
      } finally {
        state.aiLoading = false;
        renderApp();
      }
    }

    function addTask() {
      const title = state.quickTitle.trim();
      if (!title) return;
      const assignedContext = state.selectedContextFilter !== 'all' ? state.selectedContextFilter : '@Computer';
      const assignedEnergy = state.selectedEnergyFilter !== 'all' ? state.selectedEnergyFilter : 'quick';
      const assignedProject = state.selectedProjectFilter !== 'all' ? state.selectedProjectFilter : '';
      const targetStatus = state.deviceMode === 'mobile' ? state.mobileStatus : 'inbox';

      state.tasks.unshift({
        id: 't-' + Date.now(),
        title,
        status: targetStatus,
        projectId: assignedProject,
        deadline: '',
        context: assignedContext,
        energy: assignedEnergy,
        completed: false,
        notes: '',
        createdAt: getRelativeDateString(0)
      });
      state.quickTitle = '';
      savePersistedData();
      const colName = GTD_COLUMNS.find(c => c.id === targetStatus)?.shortTitle || 'Inbox';
      showToast(`In „${colName}“ gespeichert ✨`);
    }

    function quickAddAsShopping() {
      const title = state.quickTitle.trim();
      if (!title) return;
      const catId = detectShoppingCategory(title);
      const catObj = SHOPPING_CATEGORIES.find(c => c.id === catId);
      state.shoppingItems.unshift({
        id: 's-' + Date.now(),
        title,
        category: catId,
        checked: false
      });
      state.quickTitle = '';
      savePersistedData();
      showToast(`In ${catObj ? catObj.shortLabel : 'Einkauf'} gelegt 🛒`);
    }

    function addShoppingItems() {
      const raw = state.shoppingInput.trim();
      if (!raw) return;
      const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
      parts.forEach((title, idx) => {
        state.shoppingItems.unshift({
          id: `s-${Date.now()}-${idx}`,
          title,
          category: detectShoppingCategory(title),
          checked: false
        });
      });
      state.shoppingInput = '';
      savePersistedData();
      showToast(parts.length === 1 ? `„${parts[0]}“ hinzugefügt 🛒` : `${parts.length} Artikel hinzugefügt 🛒`);
    }

    function toggleTaskCompleted(taskId) {
      const t = state.tasks.find(item => item.id === taskId);
      if (!t) return;
      t.completed = !t.completed;
      if (state.focusTaskId === taskId && t.completed) {
        state.focusTaskId = null;
      }
      savePersistedData();
      showToast(t.completed ? 'Erledigt! Stark gemacht 🎉' : 'Wieder geöffnet');
    }

    function promoteInboxToNext(taskId) {
      const t = state.tasks.find(item => item.id === taskId);
      if (!t) return;
      t.status = 'next';
      savePersistedData();
      showToast('Nach „Nächste Schritte“ verschoben ⚡');
    }

    function startRandomFocusTask() {
      const candidates = state.tasks.filter(t => !t.completed && (t.status === 'next' || t.status === 'inbox'));
      if (candidates.length === 0) {
        showToast('Keine offenen Aufgaben für den Fokus-Modus 🎉');
        return;
      }
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      state.focusTaskId = pick.id;
      renderApp();
    }

    function openGoogleCalendar(task) {
      if (!task) return;
      const text = encodeURIComponent(task.title);
      const project = state.projects.find(p => p.id === task.projectId);
      const details = encodeURIComponent(
        `GTD Kontext: ${task.context || '-'}\nEnergie: ${task.energy || '-'}\nProjekt: ${project ? project.name : 'Kein Projekt'}\nNotiz: ${task.notes || ''}`
      );
      let datesParam = '';
      if (task.deadline) {
        const cleanDate = task.deadline.replace(/-/g, '');
        datesParam = `&dates=${cleanDate}/${cleanDate}`;
      }
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&details=${details}${datesParam}`;
      window.open(url, '_blank');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderApp() {
      savePersistedData();
      const root = document.getElementById('app');
      const dark = state.darkMode;
      document.documentElement.classList.toggle('dark', dark);
      document.body.className = `min-h-screen flex flex-col transition-colors duration-300 bg-grain selection:bg-emerald-400 selection:text-black ${

    function bindEvents() {

      on('btn-open-ai-settings', 'click', () => { state.showAiSettingsModal = true; renderApp(); });

      on('btn-toggle-theme', 'click', () => { state.darkMode = !state.darkMode; renderApp(); });

      const quickInput = document.getElementById('input-quick-task');
      if (quickInput) {
        quickInput.addEventListener('input', (e) => {
          const hadBtn = state.quickTitle.trim().length > 1;
          state.quickTitle = e.target.value;
          const hasBtn = state.quickTitle.trim().length > 1;
          if (hadBtn !== hasBtn) {
            const pos = quickInput.selectionStart;
            renderApp();
            const restored = document.getElementById('input-quick-task');
            if (restored) {
              restored.focus();
              restored.setSelectionRange(pos, pos);
            }
          }
        });
      }
      on('form-add-task', 'submit', (e) => { e.preventDefault(); addTask(); });
      on('btn-quick-to-shop', 'click', quickAddAsShopping);

      document.querySelectorAll('.ctx-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const ctx = btn.getAttribute('data-ctx');
          state.selectedContextFilter = (state.selectedContextFilter === ctx && ctx !== 'all') ? 'all' : ctx;
          renderApp();
        });
      });

      document.querySelectorAll('.energy-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const en = btn.getAttribute('data-en');
          state.selectedEnergyFilter = (state.selectedEnergyFilter === en && en !== 'all') ? 'all' : en;
          renderApp();
        });
      });

      on('select-project-filter', 'change', (e) => {
        state.selectedProjectFilter = e.target.value;
        renderApp();
      });

      on('btn-reset-filters', 'click', () => {
        state.selectedContextFilter = 'all';
        state.selectedEnergyFilter = 'all';
        state.selectedProjectFilter = 'all';
        renderApp();
      });

      document.querySelectorAll('.mob-col-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.mobileStatus = btn.getAttribute('data-mobcol');
          renderApp();
        });
      });

      document.querySelectorAll('.btn-check-task').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleTaskCompleted(btn.getAttribute('data-checktask'));
        });
      });

      document.querySelectorAll('.btn-gcal-direct').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tId = btn.getAttribute('data-gcal');
          const task = state.tasks.find(item => item.id === tId);
          if (task) openGoogleCalendar(task);
        });
      });

      document.querySelectorAll('.btn-promote-task').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          promoteInboxToNext(btn.getAttribute('data-promotetask'));
        });
      });

      document.querySelectorAll('.task-card').forEach(card => {
        const taskId = card.getAttribute('data-taskid');
        card.addEventListener('click', () => {
          state.selectedTaskId = taskId;
          renderApp();
        });
        card.addEventListener('dragstart', () => {
          state.draggedTaskId = taskId;
        });
      });

      document.querySelectorAll('.gtd-col-drop').forEach(colEl => {
        const colId = colEl.getAttribute('data-coldrop');
        colEl.addEventListener('dragover', (e) => e.preventDefault());
        colEl.addEventListener('drop', () => {
          if (!state.draggedTaskId) return;
          const t = state.tasks.find(item => item.id === state.draggedTaskId);
          if (t) {
            t.status = colId;
            savePersistedData();
            const colObj = GTD_COLUMNS.filter(c => c.id === colId)[0];
            showToast(`Verschoben nach „${colObj ? colObj.shortTitle : colId}“`);
          }
          state.draggedTaskId = null;
        });

      on('input-proj-name', 'input', (e) => { state.newProjectName = e.target.value; });
      on('form-add-project', 'submit', (e) => {
        e.preventDefault();
        if (!state.newProjectName.trim()) return;
        state.projects.push({
          id: 'p-' + Date.now(),
          name: state.newProjectName.trim(),
          icon: state.newProjectIcon || '🎯'
        });
        state.newProjectName = '';
        savePersistedData();
        showToast('Projekt angelegt ✨');
      });

      document.querySelectorAll('.btn-filter-proj').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedProjectFilter = btn.getAttribute('data-filterproj');
          state.activeTab = 'board';
          renderApp();
        });
      });

      const shopInput = document.getElementById('input-shopping');
      if (shopInput) {
        shopInput.addEventListener('input', (e) => {
          state.shoppingInput = e.target.value;
        });

      on('form-add-shopping', 'submit', (e) => { e.preventDefault(); addShoppingItems(); });

      on('btn-supermarket-mode', 'click', () => { state.supermarketMode = !state.supermarketMode; renderApp(); });

      document.querySelectorAll('.shop-item-row').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.getAttribute('data-shopid');
          const item = state.shoppingItems.filter(i => i.id === id)[0];
          if (item) {
            item.checked = !item.checked;
            savePersistedData();
            renderApp();
          }
        });
      });

      on('btn-toggle-checked-shop', 'click', () => {
        state.showCheckedShopping = !state.showCheckedShopping;
        renderApp();
      });
      on('btn-clear-checked-shop', 'click', () => {
        state.shoppingItems = state.shoppingItems.filter(i => !i.checked);
        savePersistedData();
        showToast('Einkaufswagen geleert ✨');
      });

      const selectedTask = state.tasks.filter(t => t.id === state.selectedTaskId)[0];
      if (selectedTask) {
        on('btn-close-task-modal', 'click', () => { state.selectedTaskId = null; renderApp(); });
        on('modal-task-backdrop', 'click', () => { state.selectedTaskId = null; renderApp(); });

        on('input-edit-task-title', 'input', (e) => { selectedTask.title = e.target.value; savePersistedData(); });
        on('input-edit-notes', 'input', (e) => { selectedTask.notes = e.target.value; savePersistedData(); });
        on('select-edit-project', 'change', (e) => { selectedTask.projectId = e.target.value; renderApp(); });
        on('input-edit-deadline', 'change', (e) => { selectedTask.deadline = e.target.value; renderApp(); });

        on('btn-date-today', 'click', () => { selectedTask.deadline = getRelativeDateString(0); renderApp(); });
        on('btn-date-tomorrow', 'click', () => { selectedTask.deadline = getRelativeDateString(1); renderApp(); });

        on('btn-ai-assist-task', 'click', () => runTaskAiAssistant(selectedTask));

        document.querySelectorAll('.btn-edit-status').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedTask.status = btn.getAttribute('data-editstatus');
            renderApp();
          });
        });

        document.querySelectorAll('.btn-edit-ctx').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedTask.context = btn.getAttribute('data-editctx');
            renderApp();
          });
        });

        document.querySelectorAll('.btn-edit-en').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedTask.energy = btn.getAttribute('data-editen');
            renderApp();
          });
        });

        on('btn-gcal-export', 'click', () => openGoogleCalendar(selectedTask));
        on('btn-move-to-shop', 'click', () => {
          const catId = detectShoppingCategory(selectedTask.title);
          state.shoppingItems.unshift({
            id: 's-' + Date.now(),
            title: selectedTask.title,
            category: catId,
            checked: false
          });
          state.tasks = state.tasks.filter(t => t.id !== selectedTask.id);
          state.selectedTaskId = null;
          savePersistedData();
          showToast('Auf die Einkaufsliste verschoben 🛒');
        });

        on('btn-delete-task', 'click', () => {
          state.tasks = state.tasks.filter(t => t.id !== selectedTask.id);
          state.selectedTaskId = null;
          savePersistedData();
          showToast('Aufgabe gelöscht');
        });
      }
    }

    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
